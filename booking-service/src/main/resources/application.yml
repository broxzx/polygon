spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    username: booking
    password: booking
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bookings
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
  flyway:
    default-schema: bookings
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true